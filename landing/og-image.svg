<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#111008"/>
  <!-- Inner border -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#2a2820" stroke-width="2"/>

  <!-- Live badge -->
  <circle cx="64" cy="90" r="7" fill="#ff3d00"/>
  <text x="80" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ff3d00" letter-spacing="0.14em">LIVE</text>

  <!-- Main title -->
  <text x="60" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="116" font-weight="700" fill="#f2ede4" letter-spacing="-0.04em">ItsLive</text>

  <!-- Tagline -->
  <text x="62" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" fill="#8a8274">Website hosting for the AI age.</text>

  <!-- Feature chips -->
  <rect x="62" y="374" width="178" height="40" rx="4" fill="#1c1a10" stroke="#2e2c1e" stroke-width="1.5"/>
  <text x="82" y="400" font-family="'Courier New', Courier, monospace" font-size="15" fill="#6a6258">No dashboards</text>

  <rect x="254" y="374" width="124" height="40" rx="4" fill="#1c1a10" stroke="#2e2c1e" stroke-width="1.5"/>
  <text x="274" y="400" font-family="'Courier New', Courier, monospace" font-size="15" fill="#6a6258">No OAuth</text>

  <rect x="392" y="374" width="150" height="40" rx="4" fill="#1c1a10" stroke="#2e2c1e" stroke-width="1.5"/>
  <text x="412" y="400" font-family="'Courier New', Courier, monospace" font-size="15" fill="#6a6258">No build step</text>

  <!-- Horizontal rule -->
  <line x1="60" y1="462" x2="590" y2="462" stroke="#2e2c1e" stroke-width="1.5"/>
  <text x="62" y="502" font-family="'Courier New', Courier, monospace" font-size="20" fill="#4a4740">itslive.fyi</text>

  <!-- Right panel: terminal -->
  <rect x="680" y="58" width="462" height="514" rx="10" fill="#0d0c08" stroke="#2a2820" stroke-width="1.5"/>
  <!-- Terminal header -->
  <rect x="680" y="58" width="462" height="48" rx="10" fill="#181510"/>
  <rect x="680" y="86" width="462" height="20" fill="#181510"/>
  <circle cx="708" cy="82" r="5" fill="#2e2c1e"/>
  <circle cx="727" cy="82" r="5" fill="#2e2c1e"/>
  <circle cx="746" cy="82" r="5" fill="#2e2c1e"/>
  <text x="911" y="88" font-family="'Courier New', Courier, monospace" font-size="12" fill="#3a3830" text-anchor="middle" letter-spacing="0.08em">ItsLive API</text>

  <!-- Code block -->
  <text x="710" y="140" font-family="'Courier New', Courier, monospace" font-size="13" fill="#3a3830"># 1. Get an API key</text>
  <text x="710" y="164" font-family="'Courier New', Courier, monospace" font-size="13" fill="#ff6b35">POST</text>
  <text x="754" y="164" font-family="'Courier New', Courier, monospace" font-size="13" fill="#7a7268"> /signup  {"email": "..."}</text>

  <text x="710" y="208" font-family="'Courier New', Courier, monospace" font-size="13" fill="#3a3830"># 2. Create a site</text>
  <text x="710" y="232" font-family="'Courier New', Courier, monospace" font-size="13" fill="#ff6b35">POST</text>
  <text x="754" y="232" font-family="'Courier New', Courier, monospace" font-size="13" fill="#7a7268"> /sites  {}</text>

  <text x="710" y="276" font-family="'Courier New', Courier, monospace" font-size="13" fill="#3a3830"># 3. Deploy</text>
  <text x="710" y="300" font-family="'Courier New', Courier, monospace" font-size="13" fill="#ff6b35">PUT</text>
  <text x="747" y="300" font-family="'Courier New', Courier, monospace" font-size="13" fill="#7a7268">  /sites/violet-crane-42</text>
  <text x="710" y="320" font-family="'Courier New', Courier, monospace" font-size="13" fill="#7a7268">     --data index.html</text>

  <line x1="710" y1="348" x2="1120" y2="348" stroke="#2a2820" stroke-width="1"/>

  <text x="710" y="376" font-family="'Courier New', Courier, monospace" font-size="12" fill="#3a3830">→ 201 Created</text>
  <text x="710" y="404" font-family="'Courier New', Courier, monospace" font-size="13" fill="#5a8a6a">{"url":</text>
  <text x="768" y="404" font-family="'Courier New', Courier, monospace" font-size="13" fill="#7a7268"> "https://violet-crane-42</text>
  <text x="710" y="424" font-family="'Courier New', Courier, monospace" font-size="13" fill="#7a7268">         .itslive.fyi"}</text>

  <!-- Live indicator -->
  <rect x="710" y="456" width="388" height="50" rx="6" fill="#0a1a10" stroke="#1a3a22" stroke-width="1.5"/>
  <circle cx="733" cy="481" r="6" fill="#22a060"/>
  <text x="750" y="487" font-family="'Courier New', Courier, monospace" font-size="15" fill="#22a060">violet-crane-42.itslive.fyi</text>
</svg>
